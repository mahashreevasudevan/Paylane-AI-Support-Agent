[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paylane-support-agent"
version = "0.1.0"
description = "Policy-enforced mock AI support agent for the Paylane take-home assignment"
requires-python = ">=3.11"
dependencies = ["openai>=1.40.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["paylane_agent*"]
